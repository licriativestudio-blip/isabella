<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Isabella Pessanha Bittar de Carvalho | Psicóloga Clínica e Acompanhamento Terapêutico</title>
<meta name="description" content="Psicologia clínica e Acompanhamento Terapêutico. Atendimentos presenciais e on-line.">
<style>
:root{--suave:rgba(255,255,255,.9);--ouro:#f0d9a0;
  --fonte:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif}
*{box-sizing:border-box;margin:0}
html{background:#2b2e30}
body{color:#fff;font-family:var(--fonte);overflow-x:hidden}

/* Fundo: vídeo fixo em loop, sempre o mesmo, que se aproxima conforme você rola */
.fundo{position:fixed;inset:0;overflow:hidden;z-index:0;
  background:linear-gradient(#a9bcc6 0,#d4d9cd 44%,#6a6c68 45%,#34353a 100%)}
#foto{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform}
.veu{position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.3),rgba(0,0,0,.5))}
#barra{position:fixed;left:0;top:0;height:3px;width:0;background:var(--ouro);z-index:9}

.hero{position:relative;z-index:1;height:100vh;height:100svh;display:flex;flex-direction:column;
  align-items:center;text-align:center;padding:16vh 1.25rem 0;text-shadow:0 2px 18px rgba(0,0,0,.6)}
.hero h1{font-size:clamp(2.2rem,7vw,5rem);font-weight:500;line-height:1.05;letter-spacing:-.02em;max-width:16ch}
.hero .papel{margin-top:1.2rem;font-size:clamp(1rem,2.6vw,1.4rem)}
.hero .crp{margin-top:.4rem;color:var(--suave);font-size:.95rem}
.hero .dica{margin-top:1.6rem;font-style:italic;color:var(--ouro)}

.bloco{position:relative;z-index:1;min-height:100vh;padding:10vh 1.25rem 8vh}
.in{position:relative;max-width:38rem}
.txt{opacity:0;background:rgba(14,16,16,.46);-webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
  padding:1.4rem 1.5rem;border-radius:4px;margin-top:1.8rem;will-change:transform,opacity}
h2{font-size:clamp(1.9rem,4.6vw,3rem);line-height:1.08;letter-spacing:-.01em;font-weight:500}
h2 small{display:block;margin-top:.6rem;font-size:.5em;font-style:italic;color:var(--ouro);letter-spacing:0;line-height:1.3}
.txt h3{font-size:1.2rem;font-weight:500;margin:1.5rem 0 .5rem;color:var(--ouro)}
.txt p,.txt li{color:var(--suave);line-height:1.65}
.txt p{margin:0 0 1rem}
.txt h2+p,.txt h2+h3{margin-top:1.1rem}
.txt ul{margin:1.1rem 0 0 1.1rem}
.txt li{margin-bottom:.8rem}
.txt li em{display:block;color:var(--ouro)}
.txt a{color:#fff;text-underline-offset:3px}
.txt a.btn{display:inline-block;margin:.2rem .6rem .6rem 0;padding:.65rem 1.15rem;border:1.5px solid var(--ouro);
  border-radius:999px;background:rgba(240,217,160,.14);text-decoration:none;font-size:.95rem}
.txt a.btn:hover,.txt a.btn:focus-visible{background:var(--ouro);color:#2b2e30}

.imgs{position:relative;display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem 4%}
.f{position:relative;overflow:hidden;background:var(--c);aspect-ratio:var(--ar);
  border:5px solid rgba(255,255,255,.94);border-radius:3px;box-shadow:0 14px 36px rgba(0,0,0,.45);
  opacity:0;will-change:transform,opacity}
.z{position:absolute;inset:0;background:center/cover;will-change:transform}

.rodape{position:relative;z-index:1;background:rgba(10,12,12,.88);padding:2.4rem 1.25rem;text-align:center;
  line-height:1.7;color:var(--suave)}
.rodape strong{display:block;color:#fff;font-weight:500;font-size:1.15rem}
.rodape small{display:block;margin-top:1rem;font-size:.8rem;opacity:.75}

.txt a.btn svg{width:1.15em;height:1.15em;vertical-align:-.2em;margin-right:.5em}
.txt ul.contatos{list-style:none;margin:1.2rem 0 1rem;padding:0}
